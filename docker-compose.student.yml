services:
  odysseus:
    container_name: odysseus-course
    image: anthonydocker123/odysseus-course:latest
    ports:
      - "7860:7860"
    volumes:
      # Your data - agents, memory, tasks, and connector credentials
      - ./data:/app/data
      - ./logs:/app/logs
      # Claude login - persists between restarts after first login
      - ./claude-auth:/root/.claude
    # No env_file: auth is the subscription via the claude-auth mount; we don't
    # pass .env so there's no ANTHROPIC_API_KEY path (subscription-only).
    restart: unless-stopped
